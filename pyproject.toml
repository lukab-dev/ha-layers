[project]
name = "ha-layers"
version = "0.1.0"
description = "Priority layers for Home Assistant lights: live commands, persisted, manual changes respected."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Two suites, run separately (they load the logic package under different names):
#   pytest tests/logic   pure decision logic, any Python >= 3.12, no Home Assistant
#   pytest tests/ha      the integration inside Home Assistant (.venv-ha, Python 3.14)
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
